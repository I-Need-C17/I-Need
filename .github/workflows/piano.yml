name: Pianificatore

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  fase:
    if: ${{ github.repository == 'I-Need-C17/I-Need' && github.event.sender.type == 'User' && (github.event.label.name == 'fase:piano') }}
    uses: ./.github/workflows/esegui-fase.yml
    with:
      phase: piano
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
