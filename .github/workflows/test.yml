name: Tester indipendente

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  fase:
    if: ${{ github.repository == 'I-Need-C17/I-Need' && github.event.sender.type == 'User' && (github.event.label.name == 'fase:test' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main') }}
    uses: ./.github/workflows/esegui-fase.yml
    with:
      phase: test
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
