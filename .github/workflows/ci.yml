name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: ${{ hashFiles('backend/pom.xml') != '' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - if: ${{ hashFiles('backend/pom.xml') != '' }}
        working-directory: backend
        run: mvn -B verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build
  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: ${{ hashFiles('ai-service/requirements.txt') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt
      - if: ${{ hashFiles('ai-service/requirements.txt') != '' }}
        working-directory: ai-service
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest -q
  ci-ok:
    # Questo è l'unico controllo da rendere obbligatorio nel ruleset.
    needs: [backend, frontend, ai-service]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Esito complessivo
        run: |
          echo "backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} ai-service=${{ needs.ai-service.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.ai-service.result }}" != "success" ]; then exit 1; fi
