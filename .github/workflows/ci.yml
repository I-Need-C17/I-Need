name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
  # Final check on the actual PR merge ref, triggered by the human review.
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  repository-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      backend: ${{ steps.report.outputs.backend }}
      backend_failed: ${{ steps.report.outputs.backend_failed }}
      maven: ${{ steps.maven.outcome }}
      frontend: ${{ steps.report.outputs.frontend }}
      ai_service: ${{ steps.report.outputs.ai_service }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Diff senza errori di whitespace
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: git diff --check "origin/${BASE_REF}...HEAD"
      - name: Sintassi YAML e collegamenti Markdown locali
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir.glob("{.github,docs}/**/*.{yml,yaml}", File::FNM_DOTMATCH).each { |f| YAML.parse_file(f); puts "YAML OK: #{f}" }'
          python3 - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import unquote
          errors = []
          for file in [Path("README.md"), Path("AGENTS.md"), *Path("docs").rglob("*.md")]:
              text = file.read_text(encoding="utf-8")
              for value in re.findall(r"(?<!!)\[[^\]]*\]\(([^)]+)\)", text):
                  dest = unquote(value.split("#", 1)[0].strip())
                  if not dest or "://" in dest or dest.startswith(("mailto:", "#")):
                      continue
                  if not (file.parent / dest).exists():
                      errors.append(f"{file}: link non valido -> {dest}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("OK: link Markdown locali verificati")
          PY
      - name: Segnala modifiche a test gia esistenti
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            case "$file" in
              backend/src/test/*|frontend/tests/*|frontend/src/*.test.*|frontend/src/*.spec.*|ai-service/test/*|ai-service/tests/*|ai-service/src/test/*)
                if git cat-file -e "origin/${BASE_REF}:$file" 2>/dev/null; then
                  echo "Test esistente aggiornato: $file (verificare le asserzioni durante la review)."
                fi ;;
            esac
          done < <(git diff --name-only "origin/${BASE_REF}...HEAD")
      - name: Test della logica dei workflow
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          bash -n .github/scripts/verify-project.sh
      # Temporary Java-only harness for issue #30. Never merge this branch.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Maven (compilazione e test Java)
        id: maven
        run: |
          set -euo pipefail
          if [[ -d backend/src/test/java ]] && [[ -n "$(find backend/src/test/java -name '*.java' -type f -print -quit)" ]]; then
            mvn -B -ntp -f backend/pom.xml clean test -DfailIfNoTests=true
          else
            echo 'Nessun test ancora presente: sola compilazione.'
            mvn -B -ntp -f backend/pom.xml clean compile
          fi
      - name: Riepilogo collaudo Java (report JUnit effettivi)
        id: report
        if: always() && !cancelled()
        run: python3 .github/scripts/verify-collaudo.py

  report-pr:
    needs: repository-checks
    if: always() && !cancelled() && github.repository == 'I-Need-C17/I-Need' && (github.event_name != 'pull_request_review' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Aggiorna unico riepilogo CI sulla PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_RESULT: ${{ needs.repository-checks.result }}
          BACKEND: ${{ needs.repository-checks.outputs.backend }}
          BACKEND_FAILED: ${{ needs.repository-checks.outputs.backend_failed }}
          MAVEN: ${{ needs.repository-checks.outputs.maven }}
          FRONTEND: ${{ needs.repository-checks.outputs.frontend }}
          AI_SERVICE: ${{ needs.repository-checks.outputs.ai_service }}
        run: |
          set -euo pipefail
          # No checkout or execution of application code in this write-enabled job.
          prs=$(gh api --method GET "repos/$REPO/pulls" -f state=open -f base=main -f "head=${REPO%%/*}:$BRANCH")
          pr=$(jq -r --arg sha "$HEAD_SHA" --arg repo "$REPO" '.[] | select(.head.sha == $sha and .head.repo.full_name == $repo) | .number' <<< "$prs" | head -n 1)
          [[ -n "$pr" ]] || exit 0
          safe_counts() {
            case "$1" in
              'N/A (componente non inizializzato)'|'Non eseguito (CI applicativa da configurare)') printf '%s' "$1";;
              *) if [[ "$1" =~ ^[0-9]+\ superati,\ [0-9]+\ falliti/errori,\ [0-9]+\ saltati$ ]]; then printf '%s' "$1"; else printf 'Non disponibile'; fi;;
            esac
          }
          safe_status() {
            case "$1" in success|failure|skipped|cancelled) printf '%s' "$1";; *) printf 'non eseguito';; esac
          }
          FAILED_NAMES=$(printf '%s' "$BACKEND_FAILED" | tr '\r\n' ' ' | cut -c1-1900)
          FAILED_NAMES=${FAILED_NAMES:-Nessuno riportato}
          marker='<!-- ineed-ci-summary -->'
          body=$(printf '%s\n## CI I-Need - %s\n\nCommit: `%s`\n\nModalità: collaudo temporaneo Java/JUnit (Issue #30); se non sono presenti test, solo compilazione.\n\n- Backend: %s\n- Test backend falliti: %s\n- Frontend: %s\n- AI service: %s\n- PostgreSQL: non eseguito\n- Maven (build/test): %s\n- Build frontend: non eseguito\n- Vitest: non eseguito\n- Audit npm: non eseguito\n- Python (test): non eseguito\n- Analisi SonarQube: non eseguito\n\n[Dettagli e report](https://github.com/%s/actions/runs/%s). Configurazione temporanea di prova: non integrare su main.\n' \
            "$marker" "$(safe_status "$CHECK_RESULT")" "$HEAD_SHA" "$(safe_counts "$BACKEND")" "$FAILED_NAMES" "$(safe_counts "$FRONTEND")" "$(safe_counts "$AI_SERVICE")" "$(safe_status "$MAVEN")" "$REPO" "$GITHUB_RUN_ID")
          comment=$(gh api --paginate "repos/$REPO/issues/$pr/comments?per_page=100" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- ineed-ci-summary -->"))) | .id' | tail -n 1)
          [[ "$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)" == "$HEAD_SHA" ]] || exit 0
          if [[ -n "$comment" ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment" -f "body=$body" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$pr/comments" -f "body=$body" > /dev/null
          fi
