name: CI

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request whose branch needs repository checks
        required: true
        type: string
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Diff senza errori di whitespace
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: git diff --check "origin/${BASE_REF}...HEAD"
      - name: Valida GitHub Actions
        run: |
          curl --fail --silent --show-error --location --max-time 90 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tgz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Sintassi YAML e collegamenti Markdown locali
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir.glob("{.github,docs}/**/*.{yml,yaml}", File::FNM_DOTMATCH).each { |f| YAML.parse_file(f); puts "YAML OK: #{f}" }'
          python3 - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import unquote
          errors = []
          for file in [Path("README.md"), Path("AGENTS.md"), *Path("docs").rglob("*.md")]:
              text = file.read_text(encoding="utf-8")
              for value in re.findall(r"(?<!!)\[[^\]]*\]\(([^)]+)\)", text):
                  dest = unquote(value.split("#", 1)[0].strip())
                  if not dest or "://" in dest or dest.startswith(("mailto:", "#")):
                      continue
                  if not (file.parent / dest).exists():
                      errors.append(f"{file}: link non valido -> {dest}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("OK: link Markdown locali verificati")
          PY
      - name: Segnala modifiche a test gia esistenti
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            case "$file" in
              backend/src/test/*|frontend/tests/*|frontend/src/*.test.*|frontend/src/*.spec.*|ai-service/test/*|ai-service/tests/*|ai-service/src/test/*)
                if git cat-file -e "origin/${BASE_REF}:$file" 2>/dev/null; then
                  echo "::warning::Test esistente modificato: $file — controllare che non siano state indebolite le asserzioni."
                fi ;;
            esac
          done < <(git diff --name-only "origin/${BASE_REF}...HEAD")
      - name: Verifica approvazione del piano
        run: node --test .github/scripts/piano.test.cjs
