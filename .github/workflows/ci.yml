name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Pinned actions/checkout v4.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Valida i file della pipeline
        run: bash .github/scripts/check-bootstrap.sh
      - name: Verifica i checkpoint
        run: node --test .github/scripts/check-phase.test.cjs
