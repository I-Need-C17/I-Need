name: Governance PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  governance-gate:
    name: governance-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verifica review umana, Tester e Revisore sul commit corrente
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            // Check deterministico: nessuna chiamata AI e nessuna modifica ai file.
            // Il Ruleset deve richiedere esplicitamente "governance-gate".
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) { core.setFailed('Evento privo di Pull Request.'); return; }
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: prNumber
            });
            const sha = pr.head.sha;
            const problems = [];
            if (pr.state !== 'open') {
              core.notice('PR chiusa: governance gate non applicabile.');
              return;
            }
            if (pr.draft) {
              problems.push('La PR deve essere aperta e Ready for review.');
            }
            if (pr.base.ref !== 'main' ||
                pr.head.repo?.full_name !== context.repo.owner + '/' + context.repo.repo) {
              problems.push('Il gate supporta soltanto PR interne verso main.');
            }
            const {data: files} = await github.rest.pulls.listFiles({
              ...context.repo, pull_number: prNumber, per_page: 100
            });
            if (!files.length || files.length > 80) {
              problems.push('Diff vuota o maggiore di 80 file.');
            }
            const docsOnly = files.length > 0 && files.every(f => {
              const path = f.filename;
              return path === 'README.md' || path === 'AGENTS.md' ||
                 path === '.gitignore' || path.startsWith('.github/') ||
                 path.startsWith('docs/');
            });

            const linkedIssue = (pr.body || '').match(/\b(?:Closes|Fixes)\s+#(\d+)\b/i);
            if (!docsOnly && !linkedIssue) {
              problems.push('La PR applicativa deve collegare la Issue con Closes #N o Fixes #N.');
            }
            const taskBranch = /^agent\/issue-([1-9]\d*)-implementazione$/.exec(pr.head.ref);

            async function verifyAgenticPr(issueNumber) {
              const {data: issue} = await github.rest.issues.get({
                ...context.repo, issue_number: Number(issueNumber)
              });
              const responsibleId = issue.assignees?.length === 1 ? issue.assignees[0].id : undefined;
              if (!responsibleId || linkedIssue?.[1] !== issueNumber || pr.user?.login !== 'github-actions[bot]') {
                problems.push('La PR agentica deve essere collegata alla Issue con un solo TM assegnato.');
              }

              // Eccezione SOLO per il primo bootstrap di un modulo vuoto:
              // richiede Revisore AI, Code Owner e CI; Tester applicativo N/A.
              const buildAction = '.github/actions/verifiche-app/action.yml';
              const modules = files.filter(f => f.filename !== buildAction);
              let bootstrap = !docsOnly && modules.length > 0 &&
                modules.every(f => f.filename.startsWith('frontend/') ||
                                  f.filename.startsWith('backend/') || f.filename.startsWith('ai-service/'));
              if (bootstrap) {
                const roots = [...new Set(modules.map(f => f.filename.split('/')[0]))];
                if (files.length !== modules.length && !roots.includes('ai-service')) bootstrap = false;
                for (const root of roots) {
                  const manifests = {
                    frontend: ['frontend/package.json'],
                    backend: ['backend/pom.xml'],
                    'ai-service': ['ai-service/pyproject.toml', 'ai-service/requirements.txt'],
                  }[root];
                  const manifest = manifests.find(path => files.some(f => f.filename === path && f.status === 'added'));
                  if (!manifest) {
                    bootstrap = false; break;
                  }
                  for (const path of manifests) {
                    try {
                      await github.rest.repos.getContent({...context.repo, path, ref: pr.base.sha});
                      bootstrap = false;
                    } catch (error) {
                      if (error.status !== 404) throw error;
                    }
                  }
                  if (!bootstrap) break;
                }
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: prNumber, per_page: 100
              });
              const aiReport = comments.findLast(c =>
                c.user?.login === 'github-actions[bot]' && c.created_at === c.updated_at &&
                (c.body || '').startsWith(`## Revisione AI — PR #${prNumber}\n\nCommit esaminato: ${sha}\nRun Actions: `)
              );
              if (!aiReport) {
                problems.push('Manca il report del Revisore AI sul commit ' + sha.slice(0, 12) + '.');
              }

              const testerReport = comments.findLast(c => {
                if (c.user?.login !== 'github-actions[bot]' || c.created_at !== c.updated_at) return false;
                const body = c.body || '';
                if (docsOnly) {
                  return body.startsWith(`## Tester indipendente — verifica documentale\n\nCommit esaminato: ${sha}\nRun Actions: `);
                }
                const [title, , start, end, run, result] = body.split('\n', 6);
                return title === `## Tester indipendente — PR #${prNumber}` &&
                  /^Commit di partenza: [a-f0-9]{40}$/.test(start || '') &&
                  end === `Commit dopo il test: ${sha}` && /^Run Actions: [1-9]\d*$/.test(run || '') &&
                  result === 'Risultato dei test automatici (exit code): 0';
              });
              if (!testerReport && !bootstrap) {
                problems.push('Manca il Tester riuscito e riferito al commit corrente.');
              }
              if (bootstrap) {
                core.notice('Primo bootstrap: Tester applicativo N/A; verificare build e test reali nella CI.');
              }

              async function successfulRun(report, name) {
                const id = report?.body.match(/^Run Actions: ([1-9]\d*)$/m)?.[1];
                if (!id) return false;
                const {data: run} = await github.rest.actions.getWorkflowRun({
                  ...context.repo, run_id: Number(id)
                });
                return run.name === name && run.event === 'pull_request_target' &&
                  run.status === 'completed' && run.conclusion === 'success';
              }
              if (aiReport && !await successfulRun(aiReport, 'Revisore')) {
                problems.push('Il run del Revisore associato al report non risulta riuscito.');
              }
              if (!bootstrap && testerReport && !await successfulRun(testerReport, 'Tester indipendente')) {
                problems.push('Il run del Tester associato al report non risulta riuscito.');
              }

              return responsibleId;
            }
            const responsibleId = taskBranch ? await verifyAgenticPr(taskBranch[1]) : undefined;

            const reviewList = await github.paginate(github.rest.pulls.listReviews, {
              ...context.repo, pull_number: prNumber, per_page: 100
            });
            const lastByReviewer = new Map();
            for (const review of reviewList) {
              if (review.user?.type === 'User' && ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) {
                lastByReviewer.set(review.user.id, review);
              }
            }
            const humanApproved = [...lastByReviewer.values()].some(review =>
              review.user.id !== pr.user.id && review.user.id !== responsibleId &&
              review.state === 'APPROVED' && review.commit_id === sha
            );
            if (!humanApproved) {
              problems.push('Serve una review umana APPROVED di una persona diversa dall’autore sullo SHA corrente.');
            }
            if (problems.length) {
              core.setFailed(problems.map(s => '- ' + s).join('\n'));
              return;
            }
            core.notice(taskBranch
              ? 'Gate superato: review umana, Tester se applicabile e Revisore verificati sullo SHA corrente.'
              : 'Gate superato: review umana verificata sullo SHA corrente della PR manuale.');
            core.notice('Il Ruleset verifica la review del Code Owner e repository-checks.');
