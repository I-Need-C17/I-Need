name: Revisione
on:
  pull_request_target:
    types: [ready_for_review]
    branches: [main]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  checkpoint:
    if: >-
      ${{ contains(github.event.pull_request.labels.*.name, 'fase:test')
      || contains(github.event.pull_request.body || '', 'Closes #') }}
    uses: ./.github/workflows/controllo-fase.yml
    with:
      fase: revisione
