name: Revisione tecnica
on:
  pull_request:
    branches: [main]
    types: [ready_for_review]
  workflow_call:

permissions: {}

jobs:
  segnale-revisione:
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'agent/issue-')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "Revisione richiesta sulla PR pronta."

  revisore:
    if: >-
      github.event_name == 'workflow_run' && github.ref == 'refs/heads/main' &&
      github.event.workflow_run.name == 'Revisione tecnica'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: copilot-student
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: write
    concurrency:
      group: i-need-pr-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Convalida identità, ambito e artefatti
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/workflow.py prepare revisore
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.guard.outputs.ai == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Installa Copilot CLI
        if: steps.guard.outputs.ai == 'true'
        run: npm install --prefix "$RUNNER_TEMP/copilot-cli" --ignore-scripts --no-audit --no-fund @github/copilot@1.0.114
      - name: Esegui il profilo revisore
        if: steps.guard.outputs.ai == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: python3 .github/scripts/workflow.py copilot revisore
      - name: Ricontrolla e registra la fase
        if: steps.guard.outputs.done == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/workflow.py finish revisore
