name: Controllo fase agentica
on:
  workflow_call:
    inputs:
      fase:
        required: true
        type: string
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  controllo:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      # Su pull_request_target github.sha è il commit di base, scelto da GitHub.
      # La revisione legge il diff Git senza eseguire codice del branch della PR.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: prepara
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          FASE: ${{ inputs.fase }}
          PM_LOGINS: ${{ vars.AGENTIC_PM_LOGINS }}
          PLANNER_BOT_ID: ${{ vars.AGENTIC_PLANNER_BOT_ID }}
          TM_LOGINS: ${{ vars.AGENTIC_TM_LOGINS }}
        with:
          script: |
            const { checkPhase } = require('./.github/scripts/check-phase.cjs');
            const repo = context.repo;
            const { issue, message } = await checkPhase({
              phase: process.env.FASE,
              payload: context.payload,
              pmLogins: process.env.PM_LOGINS,
              plannerBotId: process.env.PLANNER_BOT_ID,
              tmLogins: process.env.TM_LOGINS,
              getIssue: async (number) => {
                const response = await github.rest.issues.get({ ...repo, issue_number: number });
                return response.data;
              },
              listComments: (number) => github.paginate(github.rest.issues.listComments, {
                ...repo, issue_number: number, per_page: 100,
              }),
            });
            const { buildContext } = require('./.github/scripts/role-context.cjs');
            const pr = context.payload.pull_request;
            const phase = process.env.FASE;
            const packet = buildContext(phase, issue, pr?.base.sha ?? context.sha, pr?.head.sha);
            if (phase === 'test' || phase === 'revisione') {
              const fs = require('node:fs');
              const path = require('node:path');
              const dir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'contesto-'));
              const file = path.join(dir, 'contesto.json');
              fs.writeFileSync(file, JSON.stringify(packet), { mode: 0o600 });
              core.setOutput('file', file);
            }
            await core.summary
              .addHeading('Checkpoint verificato')
              .addRaw(message, true)
              .addRaw('Durante il collaudo il responsabile gestisce la fase manualmente.', true)
              .write();
      - name: Consegna il contesto selezionato al TM
        if: steps.prepara.outputs.file != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contesto-${{ inputs.fase }}-${{ github.run_attempt }}
          path: ${{ steps.prepara.outputs.file }}
          if-no-files-found: error
          retention-days: 7
