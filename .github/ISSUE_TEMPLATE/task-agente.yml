name: Task agente
description: Proponi un task da pianificare e verificare.
title: "[Task] "
labels: [task-agente]
body:
  - type: markdown
    attributes:
      value: Scegli un TM in Assignees. Il PM assegna una sola label di area.
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options: [Applicativo, Documentazione, Governance]
    validations:
      required: true
  - type: textarea
    id: obiettivo
    attributes:
      label: Obiettivo e criteri
      description: Indica risultato atteso, criteri di accettazione ed eventuali blocchi.
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: File
      description: "Una riga File: percorso per ogni candidato e Test: percorso per ogni nuovo file di test."
    validations:
      required: true
  - type: textarea
    id: fonti
    attributes:
      label: Fonti e frame
      description: Per un task applicativo usa il formato del README. Per gli altri indica i riferimenti o N/A - motivo.
    validations:
      required: true
