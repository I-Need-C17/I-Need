name: Task agente
description: Proponi un task circoscritto da pianificare e verificare.
title: "[Task] "
labels: ["task-agente"]
body:
  - type: markdown
    attributes:
      value: Seleziona un TM in Assignees. Il PM applica la label area corrispondente.
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options: [Applicativo, Documentazione, Governance]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [backend, frontend, ai-service]
    validations:
      required: true
  - type: input
    id: requisito
    attributes:
      label: UC o requisito
      description: ID della fonte approvata oppure N/A - motivo per un task non applicativo.
    validations:
      required: true
  - type: textarea
    id: obiettivo
    attributes:
      label: Obiettivo
    validations:
      required: true
  - type: textarea
    id: specifiche
    attributes:
      label: Specifiche e revisione
      description: Per i task applicativi usa le righe indicate nel README. Per gli altri indica i riferimenti o N/A - motivo.
    validations:
      required: true
  - type: textarea
    id: ambito
    attributes:
      label: Ambito
      description: "Descrivi i confini e aggiungi una riga File: percorso per ciascun candidato, Test: percorso per ciascun nuovo test applicativo."
    validations:
      required: true
  - type: textarea
    id: criteri
    attributes:
      label: Criteri di accettazione
    validations:
      required: true
  - type: textarea
    id: frame
    attributes:
      label: Category Partition e Test Frame
      description: Usa le righe CP, TF e Frame del README o indica N/A - motivo per i task non applicativi.
    validations:
      required: true
  - type: textarea
    id: dipendenze
    attributes:
      label: Dipendenze
      description: Indica gli eventuali blocchi o scrivi Nessuna.
    validations:
      required: true
