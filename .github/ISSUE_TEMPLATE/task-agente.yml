name: Task agente
description: Proponi un task da pianificare e verificare.
title: "[Task] "
labels: [task-agente]
body:
  - type: markdown
    attributes:
      value: Il PM assegna un solo TM e una label di area, poi avvia fase:piano.
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options: [Applicativo, Documentazione, Governance]
    validations:
      required: true
  - type: textarea
    id: obiettivo
    attributes:
      label: Obiettivo e criteri
      description: Indica risultato atteso, criteri di accettazione, dipendenze ed eventuali blocchi.
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: File
      description: "Una riga File: percorso per ogni candidato. Il TM sceglie i file da autorizzare tra questi candidati. Per il Tester, una riga Test: percorso per ogni nuovo test."
    validations:
      required: true
  - type: textarea
    id: fonti
    attributes:
      label: Fonti e frame
      description: "Indica Requisito: ID e Riferimento: percorso per le fonti pertinenti. Per il Tester aggiungi CP, TF e Frame come nel README."
    validations:
      required: true
